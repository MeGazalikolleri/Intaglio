<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Intaglio | Retro Rigid Paint</title>
    <style>
        /* ============================================
           INTAGLIO — RETRO RIGID LAYOUT
           1970s Swiss/Industrial Print Studio
           Fonts: IBM Plex Mono + Space Grotesk
           Palette: Cream, ink, ochre, burnt orange
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --paper: #F4ECDD;
            --paper-dark: #E8DCC4;
            --ink: #1A1814;
            --ink-soft: #3D3830;
            --ochre: #D98E2B;
            --burnt: #C1440E;
            --teal: #2C5F5D;
            --cream: #FBF6EA;
            --shadow: #B8A88C;

            --b-thick: 3px;
            --b-med: 2px;
            --b-thin: 1px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--paper-dark);
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            color: var(--ink);
            font-size: 13px;
            line-height: 1.3;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.01em;
        }

        .app-container {
            display: grid;
            grid-template-rows: 48px 1fr 46px;
            height: 100vh;
            width: 100vw;
            background: var(--paper);
            border: var(--b-thick) solid var(--ink);
            overflow: hidden;
        }

        /* ============================================
           HEADER
           ============================================ */
        .paint-header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            background: var(--paper);
            border-bottom: var(--b-thick) solid var(--ink);
            padding: 0 16px;
            gap: 20px;
            position: relative;
        }

        .paint-header::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -9px;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--burnt) 0px, var(--burnt) 8px,
                var(--ochre) 8px, var(--ochre) 16px,
                var(--teal) 16px, var(--teal) 24px,
                var(--ink) 24px, var(--ink) 32px
            );
            z-index: 5;
            border-bottom: var(--b-thin) solid var(--ink);
        }

        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .logo {
            font-family: 'Space Grotesk', 'IBM Plex Mono', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
            text-transform: uppercase;
        }

        .logo .mark { color: var(--burnt); }

        .badge {
            background: var(--ink);
            color: var(--paper);
            padding: 2px 7px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 1.5;
            border: var(--b-thin) solid var(--ink);
        }

        .canvas-status {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-soft);
            justify-self: start;
        }

        .canvas-status::before { content: "● "; color: var(--teal); }

        .header-credit {
            justify-self: end;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--paper);
            background: var(--burnt);
            border: var(--b-med) solid var(--ink);
            padding: 3px 10px;
            box-shadow: 2px 2px 0 var(--ink);
        }

        /* ============================================
           WORKSPACE
           ============================================ */
        .workspace {
            display: grid;
            grid-template-columns: 76px 1fr 216px;
            gap: 0;
            background: var(--paper);
            overflow: hidden;
            min-height: 0;
            padding-top: 9px;
        }

        /* ============================================
           TOOLS PANEL
           ============================================ */
        .tools-panel {
            background: var(--paper-dark);
            border-right: var(--b-thick) solid var(--ink);
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
            overflow-y: auto;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .tool-icon-btn {
            background: var(--cream);
            border: var(--b-med) solid var(--ink);
            width: 52px;
            height: 46px;
            border-radius: 0;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s, box-shadow 0.08s;
            color: var(--ink);
            position: relative;
            box-shadow: 3px 3px 0 var(--ink);
        }

        .tool-icon-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 115%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--ink);
            color: var(--paper);
            padding: 4px 8px;
            font-size: 0.58rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            z-index: 100;
            border: var(--b-thin) solid var(--ink);
        }

        .tool-icon-btn:hover::after { opacity: 1; }
        .tool-icon-btn:hover { background: var(--ochre); }

        .tool-icon-btn.active {
            background: var(--ink);
            color: var(--paper);
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink);
        }

        .tool-icon-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--ink);
        }

        .stroke-divider {
            width: 100%;
            height: 0;
            border-top: var(--b-med) dashed var(--ink);
            margin: 4px 0;
        }

        .shape-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            padding: 0 4px;
        }

        .shape-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink);
            cursor: pointer;
            padding: 3px 4px;
            border: var(--b-thin) solid transparent;
        }

        .shape-options label:hover {
            border-color: var(--ink);
            background: var(--cream);
        }

        .shape-options input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: var(--b-med) solid var(--ink);
            background: var(--cream);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .shape-options input[type="checkbox"]:checked { background: var(--burnt); }

        .shape-options input[type="checkbox"]:checked::after {
            content: "×";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--paper);
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
        }

        /* ============================================
           CANVAS AREA
           ============================================ */
        .canvas-area {
            background: var(--paper);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .canvas-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: var(--paper);
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: var(--paper);
            border-bottom: var(--b-thick) solid var(--ink);
            flex-shrink: 0;
            height: 40px;
        }

        .canvas-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--ink);
        }

        .canvas-title::before { content: "▙ "; color: var(--burnt); }

        .canvas-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .mini-btn {
            background: var(--cream);
            border: var(--b-med) solid var(--ink);
            padding: 3px 12px;
            font-size: 0.62rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            color: var(--ink);
            transition: all 0.08s;
            box-shadow: 2px 2px 0 var(--ink);
        }

        .mini-btn:hover { background: var(--ochre); }

        .mini-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 var(--ink);
        }

        /* ============================================
           SAVE MENU
           ============================================ */
        .save-wrapper {
            position: relative;
            display: inline-block;
        }

        .save-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 240px;
            background: var(--cream);
            border: var(--b-thick) solid var(--ink);
            box-shadow: 5px 5px 0 var(--ink);
            padding: 0;
            z-index: 500;
            display: none;
            flex-direction: column;
            animation: menuSlide 0.12s ease-out;
        }

        .save-menu.open { display: flex; }

        @keyframes menuSlide {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .save-menu-header {
            background: var(--ink);
            color: var(--paper);
            padding: 6px 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--b-med) solid var(--ink);
        }

        .save-menu-header::before { content: "▸ "; color: var(--ochre); }

        .save-menu-close {
            background: none;
            border: var(--b-thin) solid var(--paper);
            color: var(--paper);
            width: 16px;
            height: 16px;
            font-size: 0.7rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-family: 'IBM Plex Mono', monospace;
        }

        .save-menu-close:hover {
            background: var(--burnt);
            border-color: var(--burnt);
        }

        .save-option {
            display: grid;
            grid-template-columns: 36px 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: var(--cream);
            border: none;
            border-bottom: var(--b-thin) solid var(--ink);
            cursor: pointer;
            text-align: left;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--ink);
            transition: background 0.08s;
        }

        .save-option:last-of-type { border-bottom: none; }
        .save-option:hover { background: var(--ochre); }

        .save-option:active {
            background: var(--burnt);
            color: var(--paper);
        }

        .save-option-icon {
            font-size: 1.1rem;
            text-align: center;
            line-height: 1;
            border: var(--b-med) solid var(--ink);
            background: var(--paper);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .save-option-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }

        .save-option-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .save-option-desc {
            font-size: 0.56rem;
            letter-spacing: 0.03em;
            color: var(--ink-soft);
            text-transform: uppercase;
        }

        .save-option-ext {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            background: var(--paper);
            padding: 2px 6px;
            border: var(--b-thin) solid var(--ink);
        }

        .save-menu-footer {
            background: var(--paper-dark);
            padding: 8px 10px;
            border-top: var(--b-med) solid var(--ink);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .quality-row,
        .scale-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.58rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
        }

        .quality-row input[type="range"] {
            flex: 1;
            height: 6px;
            background: var(--cream);
            border: var(--b-thin) solid var(--ink);
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .quality-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 16px;
            background: var(--burnt);
            border: var(--b-thin) solid var(--ink);
            cursor: pointer;
            margin-top: -5px;
        }

        .quality-row input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 16px;
            background: var(--burnt);
            border: var(--b-thin) solid var(--ink);
            cursor: pointer;
        }

        .quality-val {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--paper);
            background: var(--ink);
            padding: 1px 6px;
            min-width: 38px;
            text-align: center;
        }

        .scale-options {
            display: flex;
            gap: 4px;
        }

        .scale-btn {
            background: var(--cream);
            border: var(--b-thin) solid var(--ink);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.58rem;
            font-weight: 700;
            padding: 2px 7px;
            cursor: pointer;
            color: var(--ink);
            transition: all 0.08s;
        }

        .scale-btn:hover { background: var(--ochre); }

        .scale-btn.active {
            background: var(--ink);
            color: var(--paper);
        }

        /* ============================================
           CANVAS WRAPPER
           ============================================ */
        .canvas-wrapper {
            background: var(--paper-dark);
            background-image:
                linear-gradient(var(--shadow) 1px, transparent 1px),
                linear-gradient(90deg, var(--shadow) 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: -1px -1px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
            padding: 20px;
            overflow: auto;
            position: relative;
        }

        .canvas-wrapper::before,
        .canvas-wrapper::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border: var(--b-med) solid var(--ink);
        }
        .canvas-wrapper::before {
            top: 8px; left: 8px;
            border-right: none; border-bottom: none;
        }
        .canvas-wrapper::after {
            bottom: 8px; right: 8px;
            border-left: none; border-top: none;
        }

        #mainCanvas {
            display: block;
            cursor: crosshair;
            background: var(--cream);
            border: var(--b-thick) solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        /* ============================================
           RIGHT PANEL
           ============================================ */
        .right-panel {
            background: var(--paper-dark);
            border-left: var(--b-thick) solid var(--ink);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .section-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
            display: block;
            border-bottom: var(--b-med) solid var(--ink);
            padding-bottom: 4px;
        }

        .section-label::before { content: "▸ "; color: var(--burnt); }

        .color-dual {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .color-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .color-item span {
            font-size: 0.58rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
        }

        #fillColorPicker,
        #strokeColorPicker {
            width: 100%;
            height: 38px;
            border: var(--b-med) solid var(--ink);
            cursor: pointer;
            background: var(--cream);
            padding: 3px;
            box-shadow: 2px 2px 0 var(--ink);
        }

        .size-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: var(--cream);
            border: var(--b-med) solid var(--ink);
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 22px;
            background: var(--burnt);
            border: var(--b-med) solid var(--ink);
            cursor: pointer;
            margin-top: -9px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 22px;
            background: var(--burnt);
            border: var(--b-med) solid var(--ink);
            cursor: pointer;
        }

        .size-value {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--paper);
            background: var(--ink);
            padding: 2px 8px;
            align-self: flex-start;
            letter-spacing: 0.05em;
            border: var(--b-med) solid var(--ink);
        }

        .swatch-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .swatch {
            aspect-ratio: 1/1;
            width: 100%;
            border: var(--b-med) solid var(--ink);
            cursor: pointer;
            transition: transform 0.08s;
            position: relative;
        }

        .swatch:hover {
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0 var(--ink);
            z-index: 2;
        }

        /* ============================================
           ACTION BAR
           ============================================ */
        .action-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: var(--paper);
            border-top: var(--b-thick) solid var(--ink);
            flex-shrink: 0;
            height: 46px;
            position: relative;
        }

        .action-bar::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -9px;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--burnt) 0px, var(--burnt) 8px,
                var(--ochre) 8px, var(--ochre) 16px,
                var(--teal) 16px, var(--teal) 24px,
                var(--ink) 24px, var(--ink) 32px
            );
            border-top: var(--b-thin) solid var(--ink);
            border-bottom: var(--b-thin) solid var(--ink);
        }

        .action-btn {
            background: var(--cream);
            border: var(--b-med) solid var(--ink);
            padding: 6px 16px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.66rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            color: var(--ink);
            transition: all 0.08s;
            box-shadow: 3px 3px 0 var(--ink);
        }

        .action-btn:hover { background: var(--ochre); }

        .action-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--ink);
        }

        .action-btn.primary {
            background: var(--burnt);
            color: var(--paper);
            border-color: var(--ink);
        }

        .action-btn.primary:hover { background: var(--ink); }

        .status-message {
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-left: auto;
            border-left: var(--b-med) solid var(--ink);
            padding-left: 16px;
        }

        .status-message::before { content: "◆ "; color: var(--teal); }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 820px) {
            .workspace { grid-template-columns: 66px 1fr 190px; }
            .tool-icon-btn { width: 46px; height: 42px; font-size: 1.1rem; }
            .right-panel { padding: 12px 8px; gap: 16px; }
            .logo { font-size: 1.15rem; }
            .header-credit { font-size: 0.55rem; padding: 2px 7px; }
            .save-menu { width: 220px; }
        }

        @media (max-width: 620px) {
            .workspace { grid-template-columns: 58px 1fr 160px; }
            .tool-icon-btn { width: 40px; height: 38px; font-size: 1rem; }
            .shape-options label { font-size: 0.5rem; }
            .canvas-status { display: none; }
            .save-menu { width: 200px; right: -40px; }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <!-- HEADER -->
    <div class="paint-header">
        <div class="logo-area">
            <div class="logo"><span class="mark">◈</span> Intaglio</div>
            <div class="badge">v1.0.0</div>
        </div>
        <div class="canvas-status">Retro Rigid · Print Studio</div>
        <div class="header-credit">Made by Gazali</div>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace">
        <!-- LEFT: TOOLS -->
        <div class="tools-panel">
            <div class="tool-group">
                <button class="tool-icon-btn" data-tool="brush" data-tooltip="Brush (B)"><span>🖌️</span></button>
                <button class="tool-icon-btn" data-tool="pencil" data-tooltip="Pencil"><span>✏️</span></button>
                <button class="tool-icon-btn" data-tool="eraser" data-tooltip="Eraser (E)"><span>🧽</span></button>
                <button class="tool-icon-btn" data-tool="fill" data-tooltip="Fill (F)"><span>🪣</span></button>
            </div>
            <div class="stroke-divider"></div>
            <div class="tool-group">
                <button class="tool-icon-btn" data-tool="rect" data-tooltip="Rect (Shift=Square)"><span>◻️</span></button>
                <button class="tool-icon-btn" data-tool="ellipse" data-tooltip="Ellipse (Shift=Circle)"><span>⚪</span></button>
                <button class="tool-icon-btn" data-tool="line" data-tooltip="Line"><span>➖</span></button>
                <button class="tool-icon-btn" data-tool="triangle" data-tooltip="Triangle"><span>🔺</span></button>
            </div>
            <div class="stroke-divider"></div>
            <div class="shape-options">
                <label><input type="checkbox" id="filledShapes"> Fill</label>
                <label><input type="checkbox" id="outlineOnly"> Outline</label>
            </div>
        </div>

        <!-- CENTER: CANVAS -->
        <div class="canvas-area">
            <div class="canvas-section">
                <div class="canvas-header">
                    <div class="canvas-title">Plate · 1200×700</div>
                    <div class="canvas-actions">
                        <button class="mini-btn" id="clearCanvasBtn">Clear</button>
                        <div class="save-wrapper">
                            <button class="mini-btn" id="saveMenuBtn">Save ▾</button>
                            <!-- SAVE MENU -->
                            <div class="save-menu" id="saveMenu">
                                <div class="save-menu-header">
                                    <span>Export Impression</span>
                                    <button class="save-menu-close" id="saveMenuClose" title="Close">×</button>
                                </div>
                                <button class="save-option" data-format="png">
                                    <div class="save-option-icon">🖼️</div>
                                    <div class="save-option-info">
                                        <span class="save-option-name">PNG</span>
                                        <span class="save-option-desc">Lossless · transparency</span>
                                    </div>
                                    <span class="save-option-ext">.PNG</span>
                                </button>
                                <button class="save-option" data-format="jpeg">
                                    <div class="save-option-icon">📷</div>
                                    <div class="save-option-info">
                                        <span class="save-option-name">JPEG</span>
                                        <span class="save-option-desc">Compressed · smaller</span>
                                    </div>
                                    <span class="save-option-ext">.JPG</span>
                                </button>
                                <button class="save-option" data-format="webp">
                                    <div class="save-option-icon">⚡</div>
                                    <div class="save-option-info">
                                        <span class="save-option-name">WebP</span>
                                        <span class="save-option-desc">Modern · efficient</span>
                                    </div>
                                    <span class="save-option-ext">.WEBP</span>
                                </button>
                                <div class="save-menu-footer">
                                    <div class="scale-row">
                                        <span>Scale</span>
                                        <div class="scale-options" id="scaleOptions">
                                            <button class="scale-btn active" data-scale="1">1×</button>
                                            <button class="scale-btn" data-scale="2">2×</button>
                                            <button class="scale-btn" data-scale="3">3×</button>
                                        </div>
                                    </div>
                                    <div class="quality-row">
                                        <span>Quality</span>
                                        <input type="range" id="exportQuality" min="10" max="100" value="92">
                                        <span class="quality-val" id="qualityVal">92%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="mainCanvas" width="1200" height="700"></canvas>
                </div>
            </div>
        </div>

        <!-- RIGHT: CONTROLS -->
        <div class="right-panel">
            <div class="color-section">
                <div class="section-label">Ink</div>
                <div class="color-dual">
                    <div class="color-item">
                        <span>Fill</span>
                        <input type="color" id="fillColorPicker" value="#C25A3A">
                    </div>
                    <div class="color-item">
                        <span>Stroke</span>
                        <input type="color" id="strokeColorPicker" value="#5D3A1A">
                    </div>
                </div>
            </div>
            <div class="size-section">
                <div class="section-label">Nib</div>
                <input type="range" id="brushSize" min="1" max="40" value="5">
                <div class="size-value" id="sizeValue">5px</div>
            </div>
            <div class="color-section">
                <div class="section-label">Palette</div>
                <div class="swatch-palette" id="swatchPalette"></div>
            </div>
        </div>
    </div>

    <!-- ACTION BAR -->
    <div class="action-bar">
        <button id="newCanvasBtn" class="action-btn primary">New Plate</button>
        <button id="undoBtn" class="action-btn">Undo</button>
        <button id="saveQuickBtn" class="action-btn">💾 Print PNG</button>
        <div class="status-message">Bucket works — pick fill, click</div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentTool = 'brush';
        let drawing = false;
        let lastX = 0, lastY = 0;
        let shapeStart = { x: 0, y: 0 };
        let tempCanvas = null;
        let shapeActive = false;
        let shiftPressed = false;
        
        let fillColor = '#C25A3A';
        let strokeColor = '#5D3A1A';
        let brushSize = 5;
        let filledShapes = false;
        let outlineOnly = false;
        
        let historyStack = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;
        
        // Export settings
        let exportScale = 1;
        let exportQuality = 0.92;
        
        // ---------- CANVAS SETUP ----------
        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const maxWidth = wrapper.clientWidth - 40;
            const maxHeight = wrapper.clientHeight - 40;
            const aspect = 1200 / 700;
            let newWidth = maxWidth;
            let newHeight = newWidth / aspect;
            if (newHeight > maxHeight) {
                newHeight = maxHeight;
                newWidth = newHeight * aspect;
            }
            canvas.style.width = `${newWidth}px`;
            canvas.style.height = `${newHeight}px`;
        }
        
        function initCanvas() {
            canvas.width = 1200;
            canvas.height = 700;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveToHistory();
            resizeCanvas();
        }
        
        window.addEventListener('resize', resizeCanvas);
        
        // ---------- HISTORY ----------
        function saveToHistory() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (historyIndex < MAX_HISTORY - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            } else {
                historyStack.shift();
                historyIndex--;
            }
            historyStack.push(imageData);
            historyIndex = historyStack.length - 1;
            while (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
                historyIndex--;
            }
        }
        
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                const prevState = historyStack[historyIndex];
                ctx.putImageData(prevState, 0, 0);
                showTempMsg("Undo");
            } else {
                showTempMsg("Nothing to undo");
            }
        }
        
        function clearCanvas() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveToHistory();
            showTempMsg("Plate cleared");
        }
        
        function newCanvas() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveToHistory();
            showTempMsg("New plate");
        }
        
        // ---------- DRAWING ----------
        function drawPixel(x, y, color, size) {
            if (currentTool === 'eraser') {
                ctx.fillStyle = '#FFFFFF';
            } else {
                ctx.fillStyle = color;
            }
            ctx.beginPath();
            ctx.arc(x, y, size/2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawStroke(fromX, fromY, toX, toY, color, size) {
            const dist = Math.hypot(toX - fromX, toY - fromY);
            const steps = Math.max(2, Math.ceil(dist / (size/2)));
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = fromX + (toX - fromX) * t;
                const y = fromY + (toY - fromY) * t;
                drawPixel(x, y, color, size);
            }
        }
        
        // ---------- FILL ----------
        function floodFill(startX, startY, targetR, targetG, targetB, targetA, replaceR, replaceG, replaceB, replaceA) {
            const w = canvas.width;
            const h = canvas.height;
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            const stack = [{x: startX, y: startY}];
            const visited = new Uint8Array(w * h);
            
            while (stack.length > 0) {
                const {x, y} = stack.pop();
                if (x < 0 || x >= w || y < 0 || y >= h) continue;
                const idx = (y * w + x) * 4;
                if (visited[idx / 4]) continue;
                const matches = data[idx] === targetR && 
                               data[idx+1] === targetG && 
                               data[idx+2] === targetB && 
                               data[idx+3] === targetA;
                if (matches) {
                    data[idx] = replaceR;
                    data[idx+1] = replaceG;
                    data[idx+2] = replaceB;
                    data[idx+3] = replaceA;
                    visited[idx / 4] = 1;
                    stack.push({x: x + 1, y});
                    stack.push({x: x - 1, y});
                    stack.push({x, y: y + 1});
                    stack.push({x, y: y - 1});
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }
        
        function performFill(x, y) {
            try {
                const pixel = ctx.getImageData(x, y, 1, 1).data;
                const targetR = pixel[0];
                const targetG = pixel[1];
                const targetB = pixel[2];
                const targetA = pixel[3];
                const replaceR = parseInt(fillColor.slice(1,3), 16);
                const replaceG = parseInt(fillColor.slice(3,5), 16);
                const replaceB = parseInt(fillColor.slice(5,7), 16);
                const replaceA = 255;
                if (targetR === replaceR && targetG === replaceG && targetB === replaceB && targetA === replaceA) {
                    showTempMsg("Already that colour");
                    return;
                }
                floodFill(Math.floor(x), Math.floor(y), targetR, targetG, targetB, targetA, replaceR, replaceG, replaceB, replaceA);
                saveToHistory();
                showTempMsg(`Filled ${fillColor}`);
            } catch(e) {
                console.error(e);
                showTempMsg("Fill failed");
            }
        }
        
        // ---------- SHAPES ----------
        function drawShape(x1, y1, x2, y2, final=true) {
            let endX = x2, endY = y2;
            if (shiftPressed && (currentTool === 'rect' || currentTool === 'ellipse')) {
                const width = Math.abs(x2 - x1);
                const height = Math.abs(y2 - y1);
                const size = Math.min(width, height);
                endX = x1 + (x2 > x1 ? size : -size);
                endY = y1 + (y2 > y1 ? size : -size);
            }
            const isFilled = filledShapes && !outlineOnly;
            const hasOutline = !filledShapes || (!outlineOnly && filledShapes) || (outlineOnly);
            
            if (!final && tempCanvas) {
                ctx.putImageData(tempCanvas, 0, 0);
            } else if (!final && !tempCanvas) {
                tempCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
            
            ctx.beginPath();
            if (currentTool === 'rect') {
                const w = endX - x1, h = endY - y1;
                if (isFilled) {
                    ctx.fillStyle = fillColor;
                    ctx.fillRect(x1, y1, w, h);
                }
                if (hasOutline) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = brushSize;
                    ctx.strokeRect(x1, y1, w, h);
                }
            } else if (currentTool === 'ellipse') {
                const cx = (x1 + endX) / 2, cy = (y1 + endY) / 2;
                const rx = Math.abs(endX - x1) / 2, ry = Math.abs(endY - y1) / 2;
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                if (isFilled) {
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                }
                if (hasOutline) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = brushSize;
                    ctx.stroke();
                }
            } else if (currentTool === 'line') {
                ctx.moveTo(x1, y1);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = brushSize;
                ctx.stroke();
            } else if (currentTool === 'triangle') {
                const midX = (x1 + endX) / 2;
                ctx.moveTo(midX, y1);
                ctx.lineTo(endX, endY);
                ctx.lineTo(x1, endY);
                ctx.closePath();
                if (isFilled) {
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                }
                if (hasOutline) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = brushSize;
                    ctx.stroke();
                }
            }
            
            if (final) {
                tempCanvas = null;
                saveToHistory();
            }
        }
        
        // ---------- COORDS ----------
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                if (e.touches.length === 0) return null;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;
            x = Math.min(Math.max(0, x), canvas.width);
            y = Math.min(Math.max(0, y), canvas.height);
            return {x, y};
        }
        
        // ---------- EVENT HANDLERS ----------
        function startDraw(e) {
            const pos = getCoords(e);
            if (!pos) return;
            
            if (currentTool === 'fill') {
                performFill(pos.x, pos.y);
                return;
            }
            
            if (['rect', 'ellipse', 'line', 'triangle'].includes(currentTool)) {
                shapeActive = true;
                shapeStart = {x: pos.x, y: pos.y};
                tempCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
                return;
            }
            
            drawing = true;
            lastX = pos.x;
            lastY = pos.y;
            if (currentTool === 'brush' || currentTool === 'pencil' || currentTool === 'eraser') {
                let col = currentTool === 'eraser' ? '#FFFFFF' : strokeColor;
                drawPixel(lastX, lastY, col, brushSize);
                saveToHistory();
            }
        }
        
        function drawMove(e) {
            const pos = getCoords(e);
            if (!pos) return;
            
            if (shapeActive && ['rect', 'ellipse', 'line', 'triangle'].includes(currentTool)) {
                if (tempCanvas) ctx.putImageData(tempCanvas, 0, 0);
                drawShape(shapeStart.x, shapeStart.y, pos.x, pos.y, false);
                return;
            }
            
            if (!drawing) return;
            if (currentTool === 'brush' || currentTool === 'pencil' || currentTool === 'eraser') {
                let col = currentTool === 'eraser' ? '#FFFFFF' : strokeColor;
                drawStroke(lastX, lastY, pos.x, pos.y, col, brushSize);
                lastX = pos.x;
                lastY = pos.y;
            }
        }
        
        function endDraw(e) {
            if (shapeActive && ['rect', 'ellipse', 'line', 'triangle'].includes(currentTool)) {
                const pos = getCoords(e);
                if (pos) {
                    drawShape(shapeStart.x, shapeStart.y, pos.x, pos.y, true);
                }
                shapeActive = false;
                tempCanvas = null;
                return;
            }
            if (drawing) {
                drawing = false;
                saveToHistory();
            }
        }
        
        // ---------- EXPORT / SAVE ----------
        function exportImage(format) {
            const mimeMap = {
                png: 'image/png',
                jpeg: 'image/jpeg',
                webp: 'image/webp'
            };
            const mime = mimeMap[format] || 'image/png';
            const ext = format === 'jpeg' ? 'jpg' : format;
            
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width * exportScale;
            exportCanvas.height = canvas.height * exportScale;
            const ectx = exportCanvas.getContext('2d');
            
            if (format === 'jpeg') {
                ectx.fillStyle = '#FFFFFF';
                ectx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            }
            
            ectx.imageSmoothingEnabled = true;
            ectx.imageSmoothingQuality = 'high';
            ectx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);
            
            let dataUrl;
            try {
                if (format === 'png') {
                    dataUrl = exportCanvas.toDataURL(mime);
                } else {
                    dataUrl = exportCanvas.toDataURL(mime, exportQuality);
                }
            } catch(err) {
                console.warn('Format not supported, falling back to PNG');
                dataUrl = exportCanvas.toDataURL('image/png');
            }
            
            const now = new Date();
            const ts = now.getFullYear() + 
                       String(now.getMonth()+1).padStart(2,'0') + 
                       String(now.getDate()).padStart(2,'0') + '-' +
                       String(now.getHours()).padStart(2,'0') + 
                       String(now.getMinutes()).padStart(2,'0') + 
                       String(now.getSeconds()).padStart(2,'0');
            const filename = `intaglio-${ts}.${ext}`;
            
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            const sizeKB = Math.round((dataUrl.length * 3 / 4) / 1024);
            showTempMsg(`Printed ${format.toUpperCase()} · ${exportScale}× · ~${sizeKB}KB`);
        }
        
        function saveQuickPNG() {
            exportImage('png');
        }
        
        // ---------- TOOL / UI HELPERS ----------
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-icon-btn').forEach(btn => {
                if (btn.dataset.tool === tool) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (tool === 'fill') canvas.style.cursor = 'cell';
            else canvas.style.cursor = 'crosshair';
            showTempMsg(`${tool.toUpperCase()} selected`);
        }
        
        function updateBrushSize() {
            brushSize = parseInt(document.getElementById('brushSize').value);
            document.getElementById('sizeValue').innerText = brushSize + 'px';
        }
        
        function updateFillColor() {
            fillColor = document.getElementById('fillColorPicker').value;
        }
        
        function updateStrokeColor() {
            strokeColor = document.getElementById('strokeColorPicker').value;
        }
        
        // ---------- PALETTE ----------
        const earthPalette = [
            '#C25A3A', '#A5572E', '#E9B284', '#D49A6A', '#8B5A2B',
            '#5D3A1A', '#F2D5B5', '#FFFFFF', '#4A6A5E', '#BC9A6C',
            '#2E5A4A', '#000000', '#FF0000', '#0000FF', '#00FF00'
        ];
        
        function buildPalette() {
            const container = document.getElementById('swatchPalette');
            container.innerHTML = '';
            earthPalette.forEach(col => {
                const sw = document.createElement('div');
                sw.classList.add('swatch');
                sw.style.backgroundColor = col;
                sw.title = col;
                sw.addEventListener('click', () => {
                    document.getElementById('fillColorPicker').value = col;
                    fillColor = col;
                    updateFillColor();
                    showTempMsg(`Fill ${col}`);
                });
                container.appendChild(sw);
            });
        }
        
        function showTempMsg(msg) {
            const statusDiv = document.querySelector('.status-message');
            if (!statusDiv) return;
            if (!statusDiv.dataset.orig) statusDiv.dataset.orig = statusDiv.innerText;
            statusDiv.innerText = `▸ ${msg}`;
            clearTimeout(statusDiv._t);
            statusDiv._t = setTimeout(() => {
                statusDiv.innerText = statusDiv.dataset.orig;
            }, 2400);
        }
        
        // ---------- KEYBOARD ----------
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Shift') shiftPressed = true;
            if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
            if (e.ctrlKey && e.key.toLowerCase() === 's') { 
                e.preventDefault(); 
                saveQuickPNG();
            }
            if (e.key === 'Escape') {
                closeSaveMenu();
            }
            if (e.key.toLowerCase() === 'b') setTool('brush');
            if (e.key.toLowerCase() === 'e') setTool('eraser');
            if (e.key.toLowerCase() === 'f') setTool('fill');
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'Shift') shiftPressed = false;
        });
        
        // ---------- CANVAS EVENTS ----------
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', drawMove);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, {passive: false});
        canvas.addEventListener('touchmove', drawMove, {passive: false});
        canvas.addEventListener('touchend', endDraw);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // ---------- UI EVENTS ----------
        document.querySelectorAll('.tool-icon-btn').forEach(btn => {
            btn.addEventListener('click', () => setTool(btn.dataset.tool));
        });
        
        document.getElementById('brushSize').addEventListener('input', updateBrushSize);
        document.getElementById('fillColorPicker').addEventListener('input', updateFillColor);
        document.getElementById('strokeColorPicker').addEventListener('input', updateStrokeColor);
        document.getElementById('clearCanvasBtn').addEventListener('click', clearCanvas);
        document.getElementById('newCanvasBtn').addEventListener('click', newCanvas);
        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('saveQuickBtn').addEventListener('click', saveQuickPNG);
        
        // ---------- SAVE MENU LOGIC ----------
        const saveMenu = document.getElementById('saveMenu');
        const saveMenuBtn = document.getElementById('saveMenuBtn');
        const saveMenuClose = document.getElementById('saveMenuClose');
        const qualitySlider = document.getElementById('exportQuality');
        const qualityVal = document.getElementById('qualityVal');
        
        function openSaveMenu() {
            saveMenu.classList.add('open');
            saveMenuBtn.classList.add('active');
        }
        
        function closeSaveMenu() {
            saveMenu.classList.remove('open');
            saveMenuBtn.classList.remove('active');
        }
        
        saveMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (saveMenu.classList.contains('open')) closeSaveMenu();
            else openSaveMenu();
        });
        
        saveMenuClose.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSaveMenu();
        });
        
        document.addEventListener('click', (e) => {
            if (!saveMenu.contains(e.target) && e.target !== saveMenuBtn) {
                closeSaveMenu();
            }
        });
        
        document.querySelectorAll('.save-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const format = btn.dataset.format;
                exportImage(format);
                closeSaveMenu();
            });
        });
        
        qualitySlider.addEventListener('input', () => {
            qualityVal.innerText = qualitySlider.value + '%';
            exportQuality = parseInt(qualitySlider.value) / 100;
        });
        
        document.querySelectorAll('.scale-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                exportScale = parseInt(btn.dataset.scale);
                showTempMsg(`Scale: ${exportScale}×`);
            });
        });
        
        document.getElementById('filledShapes').addEventListener('change', (e) => {
            filledShapes = e.target.checked;
            if (filledShapes) {
                outlineOnly = false;
                document.getElementById('outlineOnly').checked = false;
            }
        });
        
        document.getElementById('outlineOnly').addEventListener('change', (e) => {
            outlineOnly = e.target.checked;
            if (outlineOnly) {
                filledShapes = false;
                document.getElementById('filledShapes').checked = false;
            }
        });
        
        // ---------- INIT ----------
        initCanvas();
        updateBrushSize();
        updateFillColor();
        updateStrokeColor();
        buildPalette();
        setTool('brush');
        saveToHistory();
    })();
</script>
</body>
</html>
