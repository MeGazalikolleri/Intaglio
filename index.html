<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GPaint | Proudly made by Gazali</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #C7B7A3;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Anek Malayalam', 'Segoe UI', system-ui, sans-serif;
        }

        .app-container {
            background: #F2E6D8;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .paint-header {
            background: #C87A5A;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 3px solid #B25D3E;
            flex-shrink: 0;
        }
        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFF2E4;
            text-shadow: 2px 2px 0 #9B4A2E;
            font-family: 'Anek Malayalam', sans-serif;
        }
        .badge {
            background: #FBEAD5;
            padding: 3px 10px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #9B4A2E;
        }
        .canvas-status {
            font-size: 0.75rem;
            background: #DBAF87;
            padding: 4px 12px;
            border-radius: 40px;
            color: #2E241F;
            font-weight: 500;
        }

        .workspace {
            display: flex;
            flex: 1;
            padding: 12px 16px;
            gap: 16px;
            background: #EFE0CF;
            min-height: 0;
            overflow: hidden;
        }

        .tools-panel {
            width: 80px;
            background: #FCF5EA;
            border-radius: 1.5rem;
            padding: 12px 8px;
            border: 1px solid #EAD8C2;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tool-icon-btn {
            background: #FFF9F0;
            border: none;
            padding: 8px 0;
            border-radius: 20px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #9B5C3C;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tool-icon-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 110%;
            background: #5D3A1A;
            color: #FCF5EA;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 0.6rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .tool-icon-btn:hover::after {
            opacity: 1;
        }

        .tool-icon-btn.active {
            background: #C87A5A;
            color: white;
            transform: scale(0.95);
        }

        .tool-icon-btn:hover:not(.active) {
            background: #ECD9C0;
        }

        .stroke-divider {
            margin: 4px 0;
            height: 2px;
            background: #DECAAE;
        }

        .canvas-area {
            flex: 1;
            background: #E2CFB9;
            border-radius: 1.5rem;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .canvas-section {
            background: #FFF7EF;
            border-radius: 1.2rem;
            padding: 10px;
            border: 1px solid #E0C6A8;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #DECAAE;
            flex-shrink: 0;
        }

        .canvas-title {
            font-weight: 600;
            color: #9B5C3C;
            font-size: 0.8rem;
        }

        .canvas-actions {
            display: flex;
            gap: 6px;
        }

        .mini-btn {
            background: #F2E6D8;
            border: none;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            cursor: pointer;
            color: #754A2E;
        }

        .mini-btn:hover {
            background: #C87A5A;
            color: white;
        }

        .canvas-wrapper {
            background: rgb(206, 205, 205);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        #mainCanvas {
            display: block;
            border-radius: 10px;
            cursor: crosshair;
            background: white;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .right-panel {
            width: 200px;
            background: #FCF5EA;
            border-radius: 1.5rem;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #EAD8C2;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .color-section {
            text-align: center;
        }
        .section-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #B16240;
            margin-bottom: 5px;
        }
        .color-dual {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .color-item {
            text-align: center;
        }
        .color-item span {
            font-size: 0.55rem;
            display: block;
            color: #9B5C3C;
        }
        #fillColorPicker, #strokeColorPicker {
            width: 45px;
            height: 38px;
            border: 2px solid #DBAF87;
            border-radius: 0px;
            cursor: pointer;
        }
        .stroke-slider {
            width: 100%;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #C87A5A;
        }
        .size-value {
            background: #F2E2CF;
            padding: 2px 6px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: bold;
            margin-top: 4px;
            display: inline-block;
        }
        .swatch-palette {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 5px;
        }
        .swatch {
            width: 25px;
            height: 25px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #FCF5EA;
            transition: transform 0.1s;
        }
        .swatch:hover {
            transform: scale(1.08);
        }

        .action-bar {
            padding: 6px 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: #F7EDE1;
            border-top: 1px solid #E2CFB5;
            flex-shrink: 0;
        }
        .action-btn {
            background: #FFF3E6;
            border: none;
            padding: 5px 14px;
            border-radius: 50px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #754A2E;
        }
        .action-btn.primary {
            background: #C87A5A;
            color: white;
        }
        .action-btn:hover {
            background: #EAD2BA;
        }
        .status-message {
            font-size: 0.65rem;
            color: #9B6342;
            margin-left: auto;
            font-weight: 500;
        }

        @media (max-width: 700px) {
            .tools-panel { width: 65px; }
            .right-panel { width: 170px; }
            .tool-icon-btn { font-size: 1.1rem; padding: 6px 0; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <div class="paint-header">
        <div class="logo-area">
            <div class="logo">🎨 GPaint</div>
            <div class="badge">v2.1.7</div>
        </div>
        <div class="canvas-status">
            Made by Gazali
        </div>
    </div>

    <div class="workspace">
        <div class="tools-panel">
            <div class="tool-group">
                <button class="tool-icon-btn" data-tool="brush" data-tooltip="Brush (B)"><span>🖌️</span></button>
                <button class="tool-icon-btn" data-tool="pencil" data-tooltip="Pencil"><span>✏️</span></button>
                <button class="tool-icon-btn" data-tool="eraser" data-tooltip="Eraser (E)"><span>🧽</span></button>
                <button class="tool-icon-btn" data-tool="fill" data-tooltip="Fill Bucket (F)"><span>🪣</span></button>
            </div>
            <div class="stroke-divider"></div>
            <div class="tool-group">
                <button class="tool-icon-btn" data-tool="rect" data-tooltip="Rect (Shift=Square)"><span>◻️</span></button>
                <button class="tool-icon-btn" data-tool="ellipse" data-tooltip="Ellipse (Shift=Circle)"><span>⚪</span></button>
                <button class="tool-icon-btn" data-tool="line" data-tooltip="Line"><span>➖</span></button>
                <button class="tool-icon-btn" data-tool="triangle" data-tooltip="Triangle"><span>🔺</span></button>
            </div>
            <div class="stroke-divider"></div>
            <div class="tool-group">
                <label style="display: flex; align-items: center; gap: 4px; font-size: 0.6rem;"><input type="checkbox" id="filledShapes"> Fill</label>
                <label style="display: flex; align-items: center; gap: 4px; font-size: 0.6rem;"><input type="checkbox" id="outlineOnly"> Outline</label>
            </div>
        </div>

        <div class="canvas-area">
            <div class="canvas-section">
                <div class="canvas-header">
                    <div class="canvas-title">🎨 Canvas</div>
                    <div class="canvas-actions">
                        <button class="mini-btn" id="clearCanvasBtn">Clear</button>
                        <button class="mini-btn" id="saveCanvasBtn">Save</button>
                    </div>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="mainCanvas" width="1200" height="700"></canvas>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="color-section">
                <div class="section-label">🎨 Colors</div>
                <div class="color-dual">
                    <div class="color-item">
                        <span>Fill</span>
                        <input type="color" id="fillColorPicker" value="#C25A3A">
                    </div>
                    <div class="color-item">
                        <span>Stroke</span>
                        <input type="color" id="strokeColorPicker" value="#5D3A1A">
                    </div>
                </div>
            </div>
            <div class="size-section">
                <div class="section-label">✏️ Size</div>
                <input type="range" id="brushSize" min="1" max="40" value="5">
                <div class="size-value" id="sizeValue">5px</div>
            </div>
            <div class="color-section">
                <div class="section-label">🎨 Palette</div>
                <div class="swatch-palette" id="swatchPalette"></div>
            </div>
        </div>
    </div>

    <div class="action-bar">
        <button id="newCanvasBtn" class="action-btn">🆕 New</button>
        <button id="undoBtn" class="action-btn">↩️ Undo</button>
        <div class="status-message">✔️ BUCKET WORKS! Pick Fill Color, click anywhere</div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentTool = 'brush';
        let drawing = false;
        let lastX = 0, lastY = 0;
        let shapeStart = { x: 0, y: 0 };
        let tempCanvas = null;
        let shapeActive = false;
        let shiftPressed = false;
        
        let fillColor = '#C25A3A';
        let strokeColor = '#5D3A1A';
        let brushSize = 5;
        let filledShapes = false;
        let outlineOnly = false;
        
        let historyStack = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;
        
        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const maxWidth = wrapper.clientWidth - 20;
            const maxHeight = wrapper.clientHeight - 20;
            const aspect = 1200 / 700;
            let newWidth = maxWidth;
            let newHeight = newWidth / aspect;
            if (newHeight > maxHeight) {
                newHeight = maxHeight;
                newWidth = newHeight * aspect;
            }
            canvas.style.width = `${newWidth}px`;
            canvas.style.height = `${newHeight}px`;
        }
        
        function initCanvas() {
            canvas.width = 1200;
            canvas.height = 700;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveToHistory();
            resizeCanvas();
        }
        
        window.addEventListener('resize', resizeCanvas);
        
        function saveToHistory() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (historyIndex < MAX_HISTORY - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            } else {
                historyStack.shift();
                historyIndex--;
            }
            historyStack.push(imageData);
            historyIndex = historyStack.length - 1;
            while (historyStack.length > MAX_HISTORY) {
                historyStack.shift();
                historyIndex--;
            }
        }
        
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                const prevState = historyStack[historyIndex];
                ctx.putImageData(prevState, 0, 0);
                showTempMsg("Undo");
            } else {
                showTempMsg("Nothing to undo");
            }
        }
        
        function clearCanvas() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveToHistory();
            showTempMsg("Canvas cleared");
        }
        
        function newCanvas() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveToHistory();
            showTempMsg("New canvas");
        }
        
        function drawPixel(x, y, color, size) {
            if (currentTool === 'eraser') {
                ctx.fillStyle = '#FFFFFF';
            } else {
                ctx.fillStyle = color;
            }
            ctx.beginPath();
            ctx.arc(x, y, size/2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawStroke(fromX, fromY, toX, toY, color, size) {
            const dist = Math.hypot(toX - fromX, toY - fromY);
            const steps = Math.max(2, Math.ceil(dist / (size/2)));
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = fromX + (toX - fromX) * t;
                const y = fromY + (toY - fromY) * t;
                drawPixel(x, y, color, size);
            }
        }
        
        // FLOOD FILL - COMPLETELY REWRITTEN AND WORKING
        function floodFill(startX, startY, targetR, targetG, targetB, targetA, replaceR, replaceG, replaceB, replaceA) {
            const w = canvas.width;
            const h = canvas.height;
            
            // Get image data
            const imageData = ctx.getImageData(0, 0, w, h);
            const data = imageData.data;
            
            // Stack for flood fill
            const stack = [{x: startX, y: startY}];
            const visited = new Uint8Array(w * h);
            
            while (stack.length > 0) {
                const {x, y} = stack.pop();
                
                // Check bounds
                if (x < 0 || x >= w || y < 0 || y >= h) continue;
                
                const idx = (y * w + x) * 4;
                
                // Check if visited
                if (visited[idx / 4]) continue;
                
                // Check if pixel matches target color
                const matches = data[idx] === targetR && 
                               data[idx+1] === targetG && 
                               data[idx+2] === targetB && 
                               data[idx+3] === targetA;
                
                if (matches) {
                    // Replace color
                    data[idx] = replaceR;
                    data[idx+1] = replaceG;
                    data[idx+2] = replaceB;
                    data[idx+3] = replaceA;
                    
                    visited[idx / 4] = 1;
                    
                    // Add neighbors
                    stack.push({x: x + 1, y});
                    stack.push({x: x - 1, y});
                    stack.push({x, y: y + 1});
                    stack.push({x, y: y - 1});
                }
            }
            
            // Put the modified image data back
            ctx.putImageData(imageData, 0, 0);
        }
        
        function performFill(x, y) {
            try {
                // Get the color of the pixel clicked
                const pixel = ctx.getImageData(x, y, 1, 1).data;
                const targetR = pixel[0];
                const targetG = pixel[1];
                const targetB = pixel[2];
                const targetA = pixel[3];
                
                // Parse fill color
                const replaceR = parseInt(fillColor.slice(1,3), 16);
                const replaceG = parseInt(fillColor.slice(3,5), 16);
                const replaceB = parseInt(fillColor.slice(5,7), 16);
                const replaceA = 255;
                
                // Don't fill if target is same as replace
                if (targetR === replaceR && targetG === replaceG && targetB === replaceB && targetA === replaceA) {
                    showTempMsg("Already that color!");
                    return;
                }
                
                // Perform flood fill
                floodFill(Math.floor(x), Math.floor(y), targetR, targetG, targetB, targetA, replaceR, replaceG, replaceB, replaceA);
                saveToHistory();
                showTempMsg(`Filled with ${fillColor}`);
            } catch(e) {
                console.error(e);
                showTempMsg("Fill failed - try clicking on a different area");
            }
        }
        
        // Shape drawing with proportional
        function drawShape(x1, y1, x2, y2, final=true) {
            let endX = x2, endY = y2;
            
            if (shiftPressed && (currentTool === 'rect' || currentTool === 'ellipse')) {
                const width = Math.abs(x2 - x1);
                const height = Math.abs(y2 - y1);
                const size = Math.min(width, height);
                endX = x1 + (x2 > x1 ? size : -size);
                endY = y1 + (y2 > y1 ? size : -size);
            }
            
            const isFilled = filledShapes && !outlineOnly;
            const hasOutline = !filledShapes || (!outlineOnly && filledShapes) || (outlineOnly);
            
            if (!final && tempCanvas) {
                ctx.putImageData(tempCanvas, 0, 0);
            } else if (!final && !tempCanvas) {
                tempCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
            
            ctx.beginPath();
            if (currentTool === 'rect') {
                const w = endX - x1, h = endY - y1;
                if (isFilled) {
                    ctx.fillStyle = fillColor;
                    ctx.fillRect(x1, y1, w, h);
                }
                if (hasOutline) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = brushSize;
                    ctx.strokeRect(x1, y1, w, h);
                }
            } else if (currentTool === 'ellipse') {
                const cx = (x1 + endX) / 2, cy = (y1 + endY) / 2;
                const rx = Math.abs(endX - x1) / 2, ry = Math.abs(endY - y1) / 2;
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                if (isFilled) {
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                }
                if (hasOutline) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = brushSize;
                    ctx.stroke();
                }
            } else if (currentTool === 'line') {
                ctx.moveTo(x1, y1);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = brushSize;
                ctx.stroke();
            } else if (currentTool === 'triangle') {
                const midX = (x1 + endX) / 2;
                ctx.moveTo(midX, y1);
                ctx.lineTo(endX, endY);
                ctx.lineTo(x1, endY);
                ctx.closePath();
                if (isFilled) {
                    ctx.fillStyle = fillColor;
                    ctx.fill();
                }
                if (hasOutline) {
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = brushSize;
                    ctx.stroke();
                }
            }
            
            if (final) {
                tempCanvas = null;
                saveToHistory();
            }
        }
        
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                if (e.touches.length === 0) return null;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;
            x = Math.min(Math.max(0, x), canvas.width);
            y = Math.min(Math.max(0, y), canvas.height);
            return {x, y};
        }
        
        function startDraw(e) {
            const pos = getCoords(e);
            if (!pos) return;
            
            // BUCKET TOOL - trigger fill immediately
            if (currentTool === 'fill') {
                performFill(pos.x, pos.y);
                return;
            }
            
            if (['rect', 'ellipse', 'line', 'triangle'].includes(currentTool)) {
                shapeActive = true;
                shapeStart = {x: pos.x, y: pos.y};
                tempCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
                return;
            }
            
            drawing = true;
            lastX = pos.x;
            lastY = pos.y;
            if (currentTool === 'brush' || currentTool === 'pencil' || currentTool === 'eraser') {
                let col = currentTool === 'eraser' ? '#FFFFFF' : strokeColor;
                drawPixel(lastX, lastY, col, brushSize);
                saveToHistory();
            }
        }
        
        function drawMove(e) {
            const pos = getCoords(e);
            if (!pos) return;
            
            if (shapeActive && ['rect', 'ellipse', 'line', 'triangle'].includes(currentTool)) {
                if (tempCanvas) ctx.putImageData(tempCanvas, 0, 0);
                drawShape(shapeStart.x, shapeStart.y, pos.x, pos.y, false);
                return;
            }
            
            if (!drawing) return;
            if (currentTool === 'brush' || currentTool === 'pencil' || currentTool === 'eraser') {
                let col = currentTool === 'eraser' ? '#FFFFFF' : strokeColor;
                drawStroke(lastX, lastY, pos.x, pos.y, col, brushSize);
                lastX = pos.x;
                lastY = pos.y;
            }
        }
        
        function endDraw(e) {
            if (shapeActive && ['rect', 'ellipse', 'line', 'triangle'].includes(currentTool)) {
                const pos = getCoords(e);
                if (pos) {
                    drawShape(shapeStart.x, shapeStart.y, pos.x, pos.y, true);
                }
                shapeActive = false;
                tempCanvas = null;
                return;
            }
            if (drawing) {
                drawing = false;
                saveToHistory();
            }
        }
        
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-icon-btn').forEach(btn => {
                if (btn.dataset.tool === tool) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (tool === 'fill') canvas.style.cursor = 'cell';
            else canvas.style.cursor = 'crosshair';
            showTempMsg(`${tool.toUpperCase()} selected`);
        }
        
        function updateBrushSize() {
            brushSize = parseInt(document.getElementById('brushSize').value);
            document.getElementById('sizeValue').innerText = brushSize + 'px';
        }
        
        function updateFillColor() {
            fillColor = document.getElementById('fillColorPicker').value;
        }
        
        function updateStrokeColor() {
            strokeColor = document.getElementById('strokeColorPicker').value;
        }
        
        const earthPalette = ['#C25A3A', '#A5572E', '#E9B284', '#D49A6A', '#8B5A2B', '#5D3A1A', '#F2D5B5', '#FFFFFF', '#4A6A5E', '#BC9A6C', '#2E5A4A', '#000000', '#FF0000', '#0000FF', '#00FF00'];
        function buildPalette() {
            const container = document.getElementById('swatchPalette');
            container.innerHTML = '';
            earthPalette.forEach(col => {
                const sw = document.createElement('div');
                sw.classList.add('swatch');
                sw.style.backgroundColor = col;
                sw.addEventListener('click', () => {
                    document.getElementById('fillColorPicker').value = col;
                    fillColor = col;
                    updateFillColor();
                    showTempMsg(`Fill color: ${col}`);
                });
                container.appendChild(sw);
            });
        }
        
        function showTempMsg(msg) {
            const statusDiv = document.querySelector('.status-message');
            const orig = statusDiv.innerText;
            statusDiv.innerText = `🌿 ${msg}`;
            setTimeout(() => { if (statusDiv) statusDiv.innerText = orig; }, 2000);
        }
        
        // Shift key tracking
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Shift') shiftPressed = true;
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.key === 'b') setTool('brush');
            if (e.key === 'e') setTool('eraser');
            if (e.key === 'f') setTool('fill');
        });
        window.addEventListener('keyup', (e) => { if (e.key === 'Shift') shiftPressed = false; });
        
        // Events
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', drawMove);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw);
        canvas.addEventListener('touchmove', drawMove);
        canvas.addEventListener('touchend', endDraw);
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        document.querySelectorAll('.tool-icon-btn').forEach(btn => {
            btn.addEventListener('click', () => setTool(btn.dataset.tool));
        });
        document.getElementById('brushSize').addEventListener('input', updateBrushSize);
        document.getElementById('fillColorPicker').addEventListener('input', updateFillColor);
        document.getElementById('strokeColorPicker').addEventListener('input', updateStrokeColor);
        document.getElementById('clearCanvasBtn').addEventListener('click', clearCanvas);
        document.getElementById('saveCanvasBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'gpaint.png';
            link.href = canvas.toDataURL();
            link.click();
            showTempMsg("Image saved!");
        });
        document.getElementById('newCanvasBtn').addEventListener('click', newCanvas);
        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('filledShapes').addEventListener('change', (e) => { 
            filledShapes = e.target.checked; 
            if (filledShapes) outlineOnly = false; 
            document.getElementById('outlineOnly').checked = false;
        });
        document.getElementById('outlineOnly').addEventListener('change', (e) => { 
            outlineOnly = e.target.checked; 
            if (outlineOnly) filledShapes = false; 
            document.getElementById('filledShapes').checked = false;
        });
        
        initCanvas();
        updateBrushSize();
        updateFillColor();
        updateStrokeColor();
        buildPalette();
        setTool('brush');
        saveToHistory();
    })();
</script>
</body>
</html>
